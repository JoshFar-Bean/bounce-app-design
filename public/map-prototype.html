<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bounce Map Prototype</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #16212e;
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
    }
    #map-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    #map {
      width: 100%;
      height: 100%;
    }

    /* Fallback Vector Map Canvas */
    .vector-map-fallback {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #172331;
      overflow: hidden;
    }

    /* Map Overlay Layer */
    .map-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 5;
    }

    /* User Location Marker: Blue Dot with Heading Beam & Wave Arcs */
    .user-location-marker {
      position: absolute;
      top: 382px;
      left: 248px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 10;
      transition: top 0.4s ease, left 0.4s ease;
    }
    .user-beam-wrap {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%) rotate(15deg);
      width: 96px;
      height: 120px;
      transform-origin: top center;
      pointer-events: none;
    }
    .user-beam-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }
    .user-blue-dot {
      width: 22px;
      height: 22px;
      background: #ffffff;
      border-radius: 50%;
      display: grid;
      place-items: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.45), 0 0 12px rgba(66, 133, 244, 0.65);
      position: relative;
      z-index: 5;
      margin: 0 auto;
    }
    .user-blue-dot-inner {
      width: 14px;
      height: 14px;
      background: #1a73e8;
      border-radius: 50%;
    }

    /* Google Maps Logo Watermark */
    .google-watermark {
      position: absolute;
      bottom: 285px;
      left: 16px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 3px;
      opacity: 0.9;
      pointer-events: none;
    }
    .google-watermark span {
      color: #ffffff;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: -0.02em;
      text-shadow: 0 1px 3px rgba(0,0,0,0.7);
    }

    /* --- Itinerary Overlay Styles --- */
    .itinerary-container {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: none;
      z-index: 6;
    }
    body.mode-itinerary .itinerary-container {
      display: block;
    }
    body.mode-itinerary .google-watermark {
      bottom: 160px;
    }

    /* Standard Google Maps Blue Route Duration Badges */
    .route-badge-overlay {
      position: absolute;
      transform: translate(-50%, -100%);
      background: #0d57d5;
      color: #ffffff;
      padding: 6px 12px;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45), 0 0 10px rgba(13, 87, 213, 0.4);
      display: flex;
      flex-direction: column;
      pointer-events: auto;
      cursor: pointer;
      user-select: none;
      transition: transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.22s, opacity 0.22s, background-color 0.22s;
      z-index: 25;
    }
    .route-badge-overlay:hover,
    .route-badge-overlay.highlighted {
      transform: translate(-50%, -100%) scale(1.08);
      background: #1a73e8;
      box-shadow: 0 6px 20px rgba(0, 230, 184, 0.7), 0 0 14px rgba(0, 230, 184, 0.6);
      border: 1.5px solid #00e6b8;
      z-index: 40;
    }
    .route-badge-overlay.dimmed {
      opacity: 0.28;
      transform: translate(-50%, -100%) scale(0.92);
    }
    .route-badge-top {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .route-badge-sub {
      font-size: 12px;
      font-weight: 500;
      opacity: 0.92;
      margin-left: 22px;
      margin-top: 1px;
      white-space: nowrap;
    }

    /* Place Rating Pills & Bubbles */
    .poi-rating-badge {
      position: absolute;
      transform: translate(-50%, -50%);
      background: #393d44;
      color: #ffffff;
      height: 28px;
      padding: 2px 8px 2px 4px;
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12.5px;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      pointer-events: auto;
      cursor: pointer;
      white-space: nowrap;
      z-index: 18;
      transition: transform 0.2s, opacity 0.2s;
    }
    .poi-rating-badge:hover {
      transform: translate(-50%, -50%) scale(1.08);
      z-index: 30;
    }
    .poi-rating-icon {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 11px;
    }
    .poi-rating-icon.peach {
      background: #f28b82;
      color: #202124;
    }
    .poi-rating-icon.pink {
      background: #ff8a80;
      color: #202124;
    }
    .poi-rating-icon.lavender {
      background: #d7aefb;
      color: #202124;
    }
    .poi-rating-icon.teal {
      background: #78d9ec;
      color: #202124;
    }
    .poi-rating-icon.kahve-peach {
      background: #f28b82;
      display: grid;
      place-items: center;
    }
    .poi-rating-icon.kahve-peach span {
      width: 8px;
      height: 8px;
      background: #202124;
      border-radius: 50%;
    }
    .poi-name-label {
      margin-left: 6px;
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85);
    }

    /* Stop Circle Marker */
    .stop-point-marker {
      position: absolute;
      transform: translate(-50%, -50%);
      pointer-events: auto;
      cursor: pointer;
      z-index: 20;
    }
    .stop-point-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #00e6b8;
      border: 3px solid #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5), 0 0 10px rgba(0, 230, 184, 0.7);
    }
    .stop-point-dot.current {
      background: #00e6b8;
      box-shadow: 0 0 0 4px rgba(0, 230, 184, 0.3), 0 0 14px rgba(0, 230, 184, 0.9);
      animation: pulseTeal 2s infinite;
    }
    @keyframes pulseTeal {
      0%, 100% { box-shadow: 0 0 0 4px rgba(0, 230, 184, 0.35), 0 0 14px rgba(0, 230, 184, 0.8); }
      50% { box-shadow: 0 0 0 10px rgba(0, 230, 184, 0), 0 0 20px rgba(0, 230, 184, 0.9); }
    }

    /* Light Theme Adjustments */
    body.theme-light {
      background: #e8eaed;
    }
    body.theme-light .vector-map-fallback {
      background: #e8eaed;
    }
    body.theme-light .vector-map-fallback rect[fill="#172331"],
    body.theme-light .vector-map-fallback rect[fill="#121f2d"] {
      fill: #e8eaed;
    }
    body.theme-light .vector-map-fallback path[fill="url(#parkGrad)"],
    body.theme-light .vector-map-fallback path[fill="url(#marinapark)"] {
      fill: #c8e6c9;
    }
    body.theme-light .vector-map-fallback path[fill="url(#waterGrad)"],
    body.theme-light .vector-map-fallback path[fill="url(#marinawater)"] {
      fill: #bbdefb;
    }
    body.theme-light .vector-map-fallback path[stroke="#253f58"],
    body.theme-light .vector-map-fallback path[stroke="#2d4d6c"],
    body.theme-light .vector-map-fallback path[stroke="#1e344a"],
    body.theme-light .vector-map-fallback path[stroke="#25425f"] {
      stroke: #ffffff;
    }
    body.theme-light .vector-map-fallback text {
      fill: #5f6368;
    }
    body.theme-light .poi-rating-badge {
      background: #ffffff;
      color: #202124;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }
    body.theme-light .poi-name-label {
      color: #202124;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.9);
    }
  </style>
</head>

  <script>
    let map = null;
    let mode = 'explore';
    let currentStops = [];
    let legObjects = [];
    let customOverlays = [];

    // Master Coordinates for Singapore Food Trail
    const POI_LOCATIONS = {
      'kahve': { lat: 1.2785, lng: 103.8492, name: 'Kahve' },
      'suntec': { lat: 1.2935, lng: 103.8575, name: 'Suntec City views' },
      'kobashi': { lat: 1.2840, lng: 103.8455, name: 'KŌBASHI' },
      'maxwell': { lat: 1.2804, lng: 103.8440, name: 'Maxwell Food Centre' },
      'bounce-kobashi': { lat: 1.2804, lng: 103.8440, name: 'Maxwell Food Centre' },
      'green-oasis': { lat: 1.2848, lng: 103.8502, name: 'Green Oasis · CapitaSpring' },
      'loulouca': { lat: 1.2801, lng: 103.8423, name: 'Loulouca' }
    };

    function getCoordsForStop(stop) {
      if (!stop) return { lat: 1.2840, lng: 103.8455 };
      if (POI_LOCATIONS[stop.id]) return POI_LOCATIONS[stop.id];
      const lower = (stop.title || '').toLowerCase();
      if (lower.includes('maxwell')) return POI_LOCATIONS['maxwell'];
      if (lower.includes('kahve')) return POI_LOCATIONS['kahve'];
      if (lower.includes('suntec')) return POI_LOCATIONS['suntec'];
      if (lower.includes('kobashi')) return POI_LOCATIONS['kobashi'];
      if (lower.includes('green oasis') || lower.includes('capitaspring')) return POI_LOCATIONS['green-oasis'];
      if (lower.includes('loulouca')) return POI_LOCATIONS['loulouca'];
      return { lat: 1.2840, lng: 103.8455 };
    }

    const nightModeStyles = [
      { elementType: "geometry", stylers: [{ color: "#16212e" }] },
      { elementType: "labels.text.stroke", stylers: [{ color: "#16212e" }, { weight: 3 }] },
      { elementType: "labels.text.fill", stylers: [{ color: "#8fa1b4" }] },
      { featureType: "administrative.locality", elementType: "labels.text.fill", stylers: [{ color: "#a5b6c7" }] },
      { featureType: "poi", elementType: "labels.text.fill", stylers: [{ color: "#6c8094" }] },
      { featureType: "poi.park", elementType: "geometry", stylers: [{ color: "#0f2e34" }] },
      { featureType: "poi.park", elementType: "labels.text.fill", stylers: [{ color: "#4f8087" }] },
      { featureType: "road", elementType: "geometry", stylers: [{ color: "#22384e" }] },
      { featureType: "road", elementType: "geometry.stroke", stylers: [{ color: "#1b2c3d" }] },
      { featureType: "road", elementType: "labels.text.fill", stylers: [{ color: "#9aaec0" }] },
      { featureType: "road.highway", elementType: "geometry", stylers: [{ color: "#2b4966" }] },
      { featureType: "road.highway", elementType: "geometry.stroke", stylers: [{ color: "#1f374d" }] },
      { featureType: "road.highway", elementType: "labels.text.fill", stylers: [{ color: "#b0c4d8" }] },
      { featureType: "transit", elementType: "geometry", stylers: [{ color: "#243c54" }] },
      { featureType: "transit.station", elementType: "labels.text.fill", stylers: [{ color: "#7eb382" }] },
      { featureType: "water", elementType: "geometry", stylers: [{ color: "#0c1a27" }] },
      { featureType: "water", elementType: "labels.text.fill", stylers: [{ color: "#3e5b74" }] },
      { featureType: "water", elementType: "labels.text.stroke", stylers: [{ color: "#0c1a27" }] }
    ];

    function initMap() {
      try {
        if (typeof google !== 'undefined' && google.maps) {
          map = new google.maps.Map(document.getElementById('map'), {
            center: { lat: 1.3435, lng: 103.7315 },
            zoom: 15.2,
            disableDefaultUI: true,
            gestureHandling: "greedy",
            styles: nightModeStyles
          });

          // Overlay class for custom DOM elements
          class HTMLOverlay extends google.maps.OverlayView {
            constructor(position, htmlContent, className, onClick) {
              super();
              this.position = position;
              this.htmlContent = htmlContent;
              this.className = className;
              this.onClick = onClick;
              this.div = null;
            }
            onAdd() {
              this.div = document.createElement('div');
              this.div.className = this.className;
              this.div.innerHTML = this.htmlContent;
              if (this.onClick) {
                this.div.addEventListener('click', (e) => {
                  e.stopPropagation();
                  this.onClick();
                });
              }
              const panes = this.getPanes();
              panes.overlayMouseTarget.appendChild(this.div);
            }
            draw() {
              const overlayProjection = this.getProjection();
              if (!overlayProjection || !this.div) return;
              const point = overlayProjection.fromLatLngToDivPixel(this.position);
              this.div.style.left = point.x + 'px';
              this.div.style.top = point.y + 'px';
            }
            onRemove() {
              if (this.div && this.div.parentNode) {
                this.div.parentNode.removeChild(this.div);
                this.div = null;
              }
            }
          }
          window.HTMLOverlay = HTMLOverlay;

          if (mode === 'itinerary' && currentStops.length > 0) {
            renderItinerary(currentStops);
          }
        }
      } catch (e) {
        console.warn("Google Maps init exception:", e);
      }
    }

    // Helper: Returns symbol SVG matching itinerary mode
    function getModeIconSvg(travelType) {
      if (travelType === 'downtown' || travelType === 'thomson' || travelType === 'mrt') {
        // MRT / Train icon matching itinerary train icon
        return `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="3" width="16" height="15" rx="3" fill="none" />
          <path d="M8 21l2-3M16 21l-2-3M4 11h16M8 7h.01M16 7h.01" />
        </svg>`;
      }
      if (travelType === 'bus') {
        // Bus icon matching itinerary bus icon
        return `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="3" width="16" height="16" rx="3" fill="none" />
          <path d="M4 11h16M8 16h.01M16 16h.01M7 21v-2M17 21v-2" />
        </svg>`;
      }
      // Walking person icon matching itinerary walk icon
      return `<svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor">
        <path d="M13.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM9.8 8.9L7 23h2.1l1.8-8 2.1 2v6h2v-7.5l-2.1-2 .6-3C14.8 12 16.8 13 19 13v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1L6 8.3V13h2V9.6l1.8-.7z"/>
      </svg>`;
    }

    // Generate waypoints between two points
    function generatePath(origin, destination, travelType) {
      const path = [origin];
      const latDiff = destination.lat - origin.lat;
      const lngDiff = destination.lng - origin.lng;

      if (travelType === 'downtown') {
        // Downtown line curve towards Marina Bay
        path.push({ lat: origin.lat + latDiff * 0.3, lng: origin.lng + lngDiff * 0.6 });
        path.push({ lat: origin.lat + latDiff * 0.7, lng: origin.lng + lngDiff * 0.85 });
      } else if (travelType === 'bus') {
        // Bus 107 path along street grid
        path.push({ lat: origin.lat + latDiff * 0.4, lng: origin.lng });
        path.push({ lat: origin.lat + latDiff * 0.7, lng: origin.lng + lngDiff * 0.5 });
      } else {
        // Walking paths along city blocks
        path.push({ lat: origin.lat + latDiff * 0.5, lng: origin.lng + lngDiff * 0.1 });
        path.push({ lat: origin.lat + latDiff * 0.7, lng: origin.lng + lngDiff * 0.6 });
      }
      path.push(destination);
      return path;
    }

    function renderItinerary(stops) {
      if (!stops || stops.length === 0) return;

      // Clean existing overlays & polylines
      legObjects.forEach(leg => {
        if (leg.polyline) leg.polyline.setMap(null);
        if (leg.glow) leg.glow.setMap(null);
        if (leg.badgeOverlay) leg.badgeOverlay.setMap(null);
      });
      legObjects = [];

      customOverlays.forEach(ov => ov.setMap(null));
      customOverlays = [];

      if (!map || typeof google === 'undefined' || !google.maps) {
        // SVG Fallback mode
        document.body.classList.add('mode-itinerary');
        document.body.classList.remove('mode-explore');
        document.getElementById('svg-explore-map').style.display = 'none';
        document.getElementById('svg-itinerary-map').style.display = 'block';
        return;
      }

      document.body.classList.add('mode-itinerary');
      document.body.classList.remove('mode-explore');
      document.getElementById('svg-explore-map').style.display = 'none';
      document.getElementById('svg-itinerary-map').style.display = 'none';

      const bounds = new google.maps.LatLngBounds();

      // Render each leg between adjacent stops
      for (let i = 0; i < stops.length - 1; i++) {
        const fromStop = stops[i];
        const toStop = stops[i + 1];
        const origin = getCoordsForStop(fromStop);
        const dest = getCoordsForStop(toStop);

        bounds.extend(new google.maps.LatLng(origin.lat, origin.lng));
        bounds.extend(new google.maps.LatLng(dest.lat, dest.lng));

        let travelType = 'walk';
        let badgeTime = '8 min';
        let badgeDist = '600 m';

        if (fromStop.id === 'kahve') {
          travelType = 'downtown';
          badgeTime = '12 min';
          badgeDist = 'DTL · DT17 → DT15';
        } else if (fromStop.id === 'suntec') {
          travelType = 'bus';
          badgeTime = '18 min';
          badgeDist = 'Bus 107 · 5 stops';
        } else if (fromStop.id === 'kobashi' && (toStop.id === 'bounce-kobashi' || toStop.title.includes('Maxwell'))) {
          travelType = 'walk';
          badgeTime = '4 min';
          badgeDist = '350 m';
        } else if ((fromStop.id === 'bounce-kobashi' || fromStop.title.includes('Maxwell')) && toStop.id === 'green-oasis') {
          travelType = 'walk';
          badgeTime = '11 min';
          badgeDist = '750 m';
        } else if (fromStop.id === 'green-oasis') {
          travelType = 'thomson';
          badgeTime = '14 min';
          badgeDist = 'TEL · TE19 → TE18';
        }

        // Standard Google Maps route styling rules:
        // 1. Walking: Marked by blue dots (#1a73e8)
        // 2. Bus & Car: Solid blue line (#1a73e8)
        // 3. MRT: Solid colour based on MRT line colour (#005caa for DTL, #9D5B25 for TEL)
        let strokeColor = '#1a73e8';
        let isDottedWalk = false;
        let glowColor = '#1a73e8';

        if (travelType === 'downtown') {
          strokeColor = '#005caa'; // MRT Downtown Line blue
          glowColor = '#005caa';
        } else if (travelType === 'thomson') {
          strokeColor = '#9D5B25'; // MRT Thomson-East Coast Line brown
          glowColor = '#9D5B25';
        } else if (travelType === 'bus') {
          strokeColor = '#1a73e8'; // Bus: standard solid blue
          glowColor = '#1a73e8';
        } else {
          isDottedWalk = true;
          strokeColor = '#1a73e8'; // Walk: standard blue dots
          glowColor = '#1a73e8';
        }

        const pathPoints = generatePath(origin, dest, travelType).map(p => new google.maps.LatLng(p.lat, p.lng));

        // Underlying soft glow polyline
        const glowPolyline = new google.maps.Polyline({
          path: pathPoints,
          geodesic: true,
          strokeColor: glowColor,
          strokeOpacity: 0.22,
          strokeWeight: 14,
          map: map,
          zIndex: 10 + i
        });

        // Main Polyline: Dotted circles for Walk, Solid Line for Bus / MRT
        let polyline;
        if (isDottedWalk) {
          polyline = new google.maps.Polyline({
            path: pathPoints,
            geodesic: true,
            strokeOpacity: 0,
            icons: [{
              icon: {
                path: google.maps.SymbolPath.CIRCLE,
                fillOpacity: 1,
                scale: 3.5,
                fillColor: '#1a73e8',
                strokeColor: '#ffffff',
                strokeWeight: 0.5
              },
              offset: '0',
              repeat: '13px'
            }],
            map: map,
            zIndex: 20 + i
          });
        } else {
          polyline = new google.maps.Polyline({
            path: pathPoints,
            geodesic: true,
            strokeColor: strokeColor,
            strokeOpacity: 0.95,
            strokeWeight: 6,
            map: map,
            zIndex: 20 + i
          });
        }

        const legIndex = i;
        const handleLegClick = () => {
          highlightLeg(legIndex);
          window.parent.postMessage({ type: 'ROUTE_CLICKED', index: legIndex }, '*');
        };

        polyline.addListener('click', handleLegClick);
        glowPolyline.addListener('click', handleLegClick);

        // Place Route Banner at midpoint with icon matching itinerary
        const midPoint = pathPoints[Math.floor(pathPoints.length / 2)];
        const iconSvg = getModeIconSvg(travelType);
        const badgeContent = `
          <div class="route-badge-top">
            ${iconSvg}
            <span>${badgeTime}</span>
          </div>
          <div class="route-badge-sub">${badgeDist}</div>
        `;
        const badgeOverlay = new window.HTMLOverlay(midPoint, badgeContent, `route-badge-overlay leg-badge-${i}`, handleLegClick);
        badgeOverlay.setMap(map);

        legObjects.push({
          polyline,
          glow: glowPolyline,
          badgeOverlay,
          strokeColor,
          glowColor,
          isDottedWalk,
          pathPoints,
          bounds: new google.maps.LatLngBounds(
            new google.maps.LatLng(Math.min(origin.lat, dest.lat), Math.min(origin.lng, dest.lng)),
            new google.maps.LatLng(Math.max(origin.lat, dest.lat), Math.max(origin.lng, dest.lng))
          )
        });
      }

      // Add Rating Badges & Stop Pins
      stops.forEach((stop, index) => {
        const coords = getCoordsForStop(stop);
        const latLng = new google.maps.LatLng(coords.lat, coords.lng);

        const isCurrent = stop.id === 'kobashi';
        const pinContent = `
          <div class="stop-point-dot ${isCurrent ? 'current' : ''}"></div>
        `;
        const pinOverlay = new window.HTMLOverlay(latLng, pinContent, 'stop-point-marker', () => {
          highlightLeg(Math.min(index, stops.length - 2));
          window.parent.postMessage({ type: 'ROUTE_CLICKED', index }, '*');
        });
        pinOverlay.setMap(map);
        customOverlays.push(pinOverlay);
      });

      // Sample Ratings matching reference screenshot
      const sampleRatings = [
        { lat: 1.2785, lng: 103.8492, icon: 'peach-dot', rating: '4.5', label: 'Kahve' },
        { lat: 1.2840, lng: 103.8455, icon: 'pink', rating: '4.8', label: '' },
        { lat: 1.2818, lng: 103.8445, icon: 'pink', rating: '4.6', label: '' },
        { lat: 1.2804, lng: 103.8440, icon: 'pink', rating: '4.5', label: '' },
        { lat: 1.2835, lng: 103.8475, icon: 'lavender', rating: '4.3', label: '' },
        { lat: 1.2860, lng: 103.8495, icon: 'teal', rating: '4.7', label: '' }
      ];

      sampleRatings.forEach(poi => {
        const poiLatLng = new google.maps.LatLng(poi.lat, poi.lng);
        let iconHtml = '<div class="poi-rating-icon pink">🍴</div>';
        if (poi.icon === 'peach-dot') {
          iconHtml = '<div class="poi-rating-icon kahve-peach"><span></span></div>';
        } else if (poi.icon === 'lavender') {
          iconHtml = '<div class="poi-rating-icon lavender">☕</div>';
        } else if (poi.icon === 'teal') {
          iconHtml = '<div class="poi-rating-icon teal">📷</div>';
        }

        const labelHtml = poi.label ? `<span class="poi-name-label">${poi.label}</span>` : '';
        const content = `${iconHtml}<span>${poi.rating}</span>${labelHtml}`;
        const ratingOverlay = new window.HTMLOverlay(poiLatLng, content, 'poi-rating-badge', null);
        ratingOverlay.setMap(map);
        customOverlays.push(ratingOverlay);
      });

      // Fit map bounds with padding for the top bar and bottom sheet
      map.fitBounds(bounds, { top: 120, bottom: 220, left: 40, right: 40 });
    }

    function highlightLeg(index) {
      if (!map || legObjects.length === 0) return;

      legObjects.forEach((leg, i) => {
        if (i === index) {
          // Highlight active leg
          if (leg.isDottedWalk) {
            leg.polyline.setOptions({
              icons: [{
                icon: {
                  path: google.maps.SymbolPath.CIRCLE,
                  fillOpacity: 1,
                  scale: 4.8,
                  fillColor: '#1a73e8',
                  strokeColor: '#ffffff',
                  strokeWeight: 1
                },
                offset: '0',
                repeat: '14px'
              }],
              zIndex: 100
            });
          } else {
            leg.polyline.setOptions({
              strokeColor: leg.strokeColor,
              strokeWeight: 8,
              strokeOpacity: 1.0,
              zIndex: 100
            });
          }
          leg.glow.setOptions({
            strokeColor: leg.glowColor,
            strokeWeight: 18,
            strokeOpacity: 0.45,
            zIndex: 99
          });
          if (leg.badgeOverlay && leg.badgeOverlay.div) {
            leg.badgeOverlay.div.classList.add('highlighted');
            leg.badgeOverlay.div.classList.remove('dimmed');
          }
        } else {
          // Dim other legs
          if (leg.isDottedWalk) {
            leg.polyline.setOptions({
              icons: [{
                icon: {
                  path: google.maps.SymbolPath.CIRCLE,
                  fillOpacity: 0.22,
                  scale: 3,
                  fillColor: '#1a73e8',
                  strokeColor: '#ffffff',
                  strokeWeight: 0.3
                },
                offset: '0',
                repeat: '13px'
              }],
              zIndex: 10
            });
          } else {
            leg.polyline.setOptions({
              strokeOpacity: 0.22,
              strokeWeight: 4,
              zIndex: 10
            });
          }
          leg.glow.setOptions({
            strokeOpacity: 0,
            zIndex: 5
          });
          if (leg.badgeOverlay && leg.badgeOverlay.div) {
            leg.badgeOverlay.div.classList.remove('highlighted');
            leg.badgeOverlay.div.classList.add('dimmed');
          }
        }
      });

      // Animate map camera to focus on selected leg
      if (legObjects[index]) {
        const legBounds = new google.maps.LatLngBounds();
        legObjects[index].pathPoints.forEach(pt => legBounds.extend(pt));
        map.fitBounds(legBounds, { top: 110, bottom: 220, left: 60, right: 60 });
      }
    }

    function resetHighlight() {
      if (!map || legObjects.length === 0) return;

      const allBounds = new google.maps.LatLngBounds();

      legObjects.forEach(leg => {
        if (leg.isDottedWalk) {
          leg.polyline.setOptions({
            icons: [{
              icon: {
                path: google.maps.SymbolPath.CIRCLE,
                fillOpacity: 1,
                scale: 3.5,
                fillColor: '#1a73e8',
                strokeColor: '#ffffff',
                strokeWeight: 0.5
              },
              offset: '0',
              repeat: '13px'
            }],
            zIndex: 20
          });
        } else {
          leg.polyline.setOptions({
            strokeColor: leg.strokeColor,
            strokeWeight: 6,
            strokeOpacity: 0.95,
            zIndex: 20
          });
        }
        leg.glow.setOptions({
          strokeColor: leg.glowColor,
          strokeWeight: 14,
          strokeOpacity: 0.22,
          zIndex: 10
        });
        if (leg.badgeOverlay && leg.badgeOverlay.div) {
          leg.badgeOverlay.div.classList.remove('highlighted', 'dimmed');
        }
        leg.pathPoints.forEach(pt => allBounds.extend(pt));
      });

      map.fitBounds(allBounds, { top: 120, bottom: 220, left: 40, right: 40 });
    }

    // Global helper for fallback badge clicks
    window.onBadgeClick = function(index) {
      highlightLeg(index);
      window.parent.postMessage({ type: 'ROUTE_CLICKED', index }, '*');
    };

    // Message listener for React app
    window.addEventListener('message', (event) => {
      const data = event.data;
      if (!data) return;

      if (data.type === 'THEME_TOGGLE') {
        const isDark = data.isDark;
        if (map) {
          map.setOptions({ styles: isDark ? nightModeStyles : [] });
        }
        document.body.classList.toggle('theme-light', !isDark);
      }

      if (data.type === 'SET_MODE') {
        mode = data.mode || 'explore';
        currentStops = data.stops || [];

        if (mode === 'itinerary') {
          document.body.classList.add('mode-itinerary');
          document.body.classList.remove('mode-explore');
          document.getElementById('svg-explore-map').style.display = 'none';
          document.getElementById('svg-itinerary-map').style.display = 'block';

          // Move user marker to KŌBASHI
          const userMarker = document.getElementById('user-marker-el');
          if (userMarker) {
            userMarker.style.top = '310px';
            userMarker.style.left = '205px';
          }

          if (map) {
            renderItinerary(currentStops);
          }
        } else {
          document.body.classList.remove('mode-itinerary');
          document.body.classList.add('mode-explore');
          document.getElementById('svg-explore-map').style.display = 'block';
          document.getElementById('svg-itinerary-map').style.display = 'none';

          // Move user marker back to Chinese Garden
          const userMarker = document.getElementById('user-marker-el');
          if (userMarker) {
            userMarker.style.top = '382px';
            userMarker.style.left = '248px';
          }

          if (map) {
            map.panTo({ lat: 1.3435, lng: 103.7315 });
            map.setZoom(15.2);
            // Clear itinerary objects
            legObjects.forEach(leg => {
              if (leg.polyline) leg.polyline.setMap(null);
              if (leg.glow) leg.glow.setMap(null);
              if (leg.badgeOverlay) leg.badgeOverlay.setMap(null);
            });
            legObjects = [];
            customOverlays.forEach(ov => ov.setMap(null));
            customOverlays = [];
          }
        }
      }

      if (data.type === 'HIGHLIGHT_LEG') {
        highlightLeg(data.index);
      }

      if (data.type === 'RESET_HIGHLIGHT') {
        resetHighlight();
      }

      if (data.type === 'UPDATE_STOPS') {
        currentStops = data.stops || [];
        renderItinerary(currentStops);
      }

      if (data.type === 'RECENTER') {
        if (map) {
          if (mode === 'itinerary') {
            map.panTo({ lat: 1.2840, lng: 103.8455 });
            map.setZoom(15.2);
          } else {
            map.panTo({ lat: 1.3430, lng: 103.7318 });
            map.setZoom(15.2);
          }
        }
      }
    });
  </script>
  <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCR9Vi_lsTBLbpgfDYP-0kdy81b2PkaE-w&callback=initMap"></script>
