<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bounce Map Prototype</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #16212e;
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
    }

    #map-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* Fallback Vector Map Canvas */
    .vector-map-fallback {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #172331;
      overflow: hidden;
    }

    /* Map Overlay Layer */
    .map-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 5;
    }

    /* User Location Marker: Blue Dot with Heading Beam & Wave Arcs (Hidden per user request) */
    .user-location-marker {
      display: none !important;
      position: absolute;
      top: 382px;
      left: 248px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 10;
      transition: top 0.4s ease, left 0.4s ease;
    }

    .user-beam-wrap {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%) rotate(15deg);
      width: 96px;
      height: 120px;
      transform-origin: top center;
      pointer-events: none;
    }

    .user-beam-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .user-blue-dot {
      width: 22px;
      height: 22px;
      background: #ffffff;
      border-radius: 50%;
      display: grid;
      place-items: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.45), 0 0 12px rgba(66, 133, 244, 0.65);
      position: relative;
      z-index: 5;
      margin: 0 auto;
    }

    .user-blue-dot-inner {
      width: 14px;
      height: 14px;
      background: #1a73e8;
      border-radius: 50%;
    }

    /* Google Maps Logo Watermark */
    .google-watermark {
      position: absolute;
      bottom: 285px;
      left: 16px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 3px;
      opacity: 0.9;
      pointer-events: none;
    }

    .google-watermark span {
      color: #ffffff;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: -0.02em;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
    }

    /* --- Itinerary Overlay Styles --- */
    .itinerary-container {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: none;
      z-index: 6;
    }

    body.mode-itinerary .itinerary-container {
      display: block;
    }

    body.mode-itinerary .google-watermark {
      bottom: 160px;
    }

    /* Standard Google Maps Blue Route Duration Badges */
    .route-badge-overlay {
      position: absolute;
      transform: translate(-50%, -100%);
      background: #0d57d5;
      color: #ffffff;
      padding: 6px 12px;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45), 0 0 10px rgba(13, 87, 213, 0.4);
      display: flex;
      flex-direction: column;
      pointer-events: auto;
      cursor: pointer;
      user-select: none;
      transition: transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.22s, opacity 0.22s, background-color 0.22s;
      z-index: 25;
    }

    .route-badge-overlay:hover,
    .route-badge-overlay.highlighted {
      transform: translate(-50%, -100%) scale(1.08);
      background: #1a73e8;
      box-shadow: 0 6px 20px rgba(0, 230, 184, 0.7), 0 0 14px rgba(0, 230, 184, 0.6);
      border: 1.5px solid #00e6b8;
      z-index: 40;
    }

    .route-badge-overlay.dimmed {
      opacity: 0.28;
      transform: translate(-50%, -100%) scale(0.92);
    }

    body.mode-bounce .route-badge-overlay {
      opacity: 0.6;
    }

    body.mode-bounce .route-badge-overlay:hover,
    body.mode-bounce .route-badge-overlay.highlighted {
      opacity: 1 !important;
    }

    .route-badge-top {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .route-badge-sub {
      font-size: 12px;
      font-weight: 500;
      opacity: 0.92;
      margin-left: 22px;
      margin-top: 1px;
      white-space: nowrap;
    }

    /* Place Rating Pills & Bubbles */
    .poi-rating-badge {
      position: absolute;
      transform: translate(-50%, -50%);
      background: #393d44;
      color: #ffffff;
      height: 28px;
      padding: 2px 8px 2px 4px;
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12.5px;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      pointer-events: auto;
      cursor: pointer;
      white-space: nowrap;
      z-index: 18;
      transition: transform 0.2s, opacity 0.2s;
    }

    .poi-rating-badge:hover {
      transform: translate(-50%, -50%) scale(1.08);
      z-index: 30;
    }

    .poi-rating-icon {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 11px;
    }

    .poi-rating-icon.peach {
      background: #f28b82;
      color: #202124;
    }

    .poi-rating-icon.pink {
      background: #ff8a80;
      color: #202124;
    }

    .poi-rating-icon.lavender {
      background: #d7aefb;
      color: #202124;
    }

    .poi-rating-icon.teal {
      background: #78d9ec;
      color: #202124;
    }

    .poi-rating-icon.kahve-peach {
      background: #f28b82;
      display: grid;
      place-items: center;
    }

    .poi-rating-icon.kahve-peach span {
      width: 8px;
      height: 8px;
      background: #202124;
      border-radius: 50%;
    }

    .poi-name-label {
      margin-left: 6px;
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85);
    }

    /* Stop Circle Marker */
    .stop-point-marker {
      position: absolute;
      transform: translate(-50%, -50%);
      pointer-events: auto;
      cursor: pointer;
      z-index: 20;
    }

    .stop-point-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #00e6b8;
      border: 3px solid #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5), 0 0 10px rgba(0, 230, 184, 0.7);
    }

    .stop-point-dot.current {
      background: #00e6b8;
      box-shadow: 0 0 0 4px rgba(0, 230, 184, 0.3), 0 0 14px rgba(0, 230, 184, 0.9);
      animation: pulseTeal 2s infinite;
    }

    @keyframes pulseTeal {

      0%,
      100% {
        box-shadow: 0 0 0 4px rgba(0, 230, 184, 0.35), 0 0 14px rgba(0, 230, 184, 0.8);
      }

      50% {
        box-shadow: 0 0 0 10px rgba(0, 230, 184, 0), 0 0 20px rgba(0, 230, 184, 0.9);
      }
    }

    /* Light Theme Adjustments */
    body.theme-light {
      background: #e8eaed;
    }

    body.theme-light .vector-map-fallback {
      background: #e8eaed;
    }

    body.theme-light .vector-map-fallback rect[fill="#172331"],
    body.theme-light .vector-map-fallback rect[fill="#121f2d"] {
      fill: #e8eaed;
    }

    body.theme-light .vector-map-fallback path[fill="url(#parkGrad)"],
    body.theme-light .vector-map-fallback path[fill="url(#marinapark)"] {
      fill: #c8e6c9;
    }

    body.theme-light .vector-map-fallback path[fill="url(#waterGrad)"],
    body.theme-light .vector-map-fallback path[fill="url(#marinawater)"] {
      fill: #bbdefb;
    }

    body.theme-light .vector-map-fallback path[stroke="#253f58"],
    body.theme-light .vector-map-fallback path[stroke="#2d4d6c"],
    body.theme-light .vector-map-fallback path[stroke="#1e344a"],
    body.theme-light .vector-map-fallback path[stroke="#25425f"] {
      stroke: #ffffff;
    }

    body.theme-light .vector-map-fallback text {
      fill: #5f6368;
    }

    body.theme-light .poi-rating-badge {
      background: #ffffff;
      color: #202124;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    body.theme-light .poi-name-label {
      color: #202124;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.9);
    }
  </style>
</head>

  <script>
    let map = null;
    let mode = 'explore';
    let currentStops = [];
    let legObjects = [];
    let customOverlays = [];

    // Master Coordinates for Singapore Food Trail
    const POI_LOCATIONS = {
      'kahve': { lat: 1.2785, lng: 103.8492, name: 'Kahve' },
      'suntec': { lat: 1.2935, lng: 103.8575, name: 'Suntec City views' },
      'kobashi': { lat: 1.28445, lng: 103.84475, name: 'KŌBASHI' },
      'boat-quay': { lat: 1.28655, lng: 103.85025, name: 'Boat Quay' },

    // 4. Small grey roads: Turning into Lor Telok / Circular Rd to Boat Quay riverfront destination

      { lat: 1.28445, lng: 103.84475 }, // 1. KŌBASHI on Upper Cross St (green dot)
      { lat: 1.28415, lng: 103.84520 }, // Along Upper Cross St (grey road)
      { lat: 1.28385, lng: 103.84570 }, // 2. Upper Cross St / S Bridge Rd junction
      { lat: 1.28440, lng: 103.84610 }, // Along S Bridge Rd (grey road), crossing Cross St
      { lat: 1.28510, lng: 103.84665 }, // Along S Bridge Rd, passing Hokien St
      { lat: 1.28580, lng: 103.84715 }, // Along S Bridge Rd, passing Pickering St
      { lat: 1.28640, lng: 103.84765 }, // Along S Bridge Rd, passing South Canal Rd
      { lat: 1.28680, lng: 103.84795 }, // 3. S Bridge Rd / N Canal Rd junction
      { lat: 1.28675, lng: 103.84845 }, // Along N Canal Rd (grey road)

      { lat: 1.28645, lng: 103.84940 }, // 4. Turning into Lor Telok / Circular Rd (small grey road)
      { lat: 1.28630, lng: 103.84980 }, // Along Circular Rd (small grey road)
      { lat: 1.28638, lng: 103.85010 }, // Along Circular Rd / Boat Quay connecting lane
      { lat: 1.28655, lng: 103.85025 }  // Boat Quay riverfront destination marker
    ];

    const BOAT_QUAY_TO_GREEN_OASIS_PATH = [
      { lat: 1.28655, lng: 103.85025 },
      { lat: 1.28630, lng: 103.84980 },
      { lat: 1.28580, lng: 103.85000 },
      { lat: 1.28520, lng: 103.85010 },
      { lat: 1.28480, lng: 103.85020 }
    ];

    // Exact road-following coordinates: Upper Cross St -> turning at S Bridge Rd -> S Bridge Rd past Maxwell station -> green dot across Maxwell station
    const KOBASHI_TO_MAXWELL_ROAD_PATH = [
      { lat: 1.28445, lng: 103.84475 }, // On Upper Cross St (grey road)
      { lat: 1.28415, lng: 103.84525 }, // Along Upper Cross St approaching junction
      { lat: 1.28385, lng: 103.84570 }, // Turning at S Bridge Rd
      { lat: 1.28350, lng: 103.84550 }, // Entering S Bridge Rd
      { lat: 1.28325, lng: 103.84526 }, // S Bridge Rd (past Mosque St)
      { lat: 1.28275, lng: 103.84488 }, // S Bridge Rd (past Pagoda St & Sri Mariamman Temple)
      { lat: 1.28225, lng: 103.84450 }, // S Bridge Rd (past Temple St)
      { lat: 1.28175, lng: 103.84412 }, // S Bridge Rd (past Smith St)
      { lat: 1.28120, lng: 103.84370 }, // S Bridge Rd (past Sago Ln & Buddha Tooth Relic Temple)
      { lat: 1.28070, lng: 103.84332 }, // Maxwell Station (TE18)

          class HTMLOverlay extends google.maps.OverlayView {
            constructor(position, htmlContent, className, onClick) {
              super();
              this.position = position;
              this.htmlContent = htmlContent;
              this.className = className;
              this.onClick = onClick;
              this.div = null;
            }
            onAdd() {
              this.div = document.createElement('div');
              this.div.className = this.className;
              this.div.innerHTML = this.htmlContent;
              if (this.onClick) {
                this.div.addEventListener('click', (e) => {
                  e.stopPropagation();
                  this.onClick();
                });
              }
              const panes = this.getPanes();
              panes.overlayMouseTarget.appendChild(this.div);
            }
            draw() {
              const overlayProjection = this.getProjection();
              if (!overlayProjection || !this.div) return;
              const point = overlayProjection.fromLatLngToDivPixel(this.position);
              this.div.style.left = point.x + 'px';
              this.div.style.top = point.y + 'px';
            }
            onRemove() {
              if (this.div && this.div.parentNode) {
                this.div.parentNode.removeChild(this.div);
                this.div = null;
              }
            }
          }
          window.HTMLOverlay = HTMLOverlay;

    // Generate waypoints between two points
    function generatePath(origin, destination, travelType) {
      if (origin && destination) {
        const isOriginKobashi = Math.abs(origin.lat - 1.28445) < 0.0015 || Math.abs(origin.lat - 1.2840) < 0.0015;
        const isDestMaxwell = Math.abs(destination.lat - 1.28040) < 0.0015;
        if (isOriginKobashi && isDestMaxwell) {
          return KOBASHI_TO_MAXWELL_ROAD_PATH;
        }
        const isDestBoatQuay = Math.abs(destination.lat - 1.28655) < 0.0020 || Math.abs(destination.lat - 1.2868) < 0.0020;
        if (isOriginKobashi && isDestBoatQuay) {
          return KOBASHI_TO_BOAT_QUAY_PATH;
        }
      }

      const path = [origin];
      const latDiff = destination.lat - origin.lat;
      const lngDiff = destination.lng - origin.lng;

      if (travelType === 'downtown') {
        // Downtown line curve towards Marina Bay
        path.push({ lat: origin.lat + latDiff * 0.3, lng: origin.lng + lngDiff * 0.6 });
        path.push({ lat: origin.lat + latDiff * 0.7, lng: origin.lng + lngDiff * 0.85 });
      } else if (travelType === 'bus') {
        // Bus 107 path along street grid
        path.push({ lat: origin.lat + latDiff * 0.4, lng: origin.lng });
        path.push({ lat: origin.lat + latDiff * 0.7, lng: origin.lng + lngDiff * 0.5 });
      } else {
        // Walking paths along city blocks
        path.push({ lat: origin.lat + latDiff * 0.5, lng: origin.lng + lngDiff * 0.1 });
        path.push({ lat: origin.lat + latDiff * 0.7, lng: origin.lng + lngDiff * 0.6 });
      }
      path.push(destination);
      return path;
    }

    function getImmediateLegIndex(stops) {
      if (!stops || stops.length === 0) return 0;
      const idx = stops.findIndex(s => s.id === 'kobashi' || s.current);
      if (idx !== -1 && idx < stops.length - 1) return idx;
      return Math.min(2, Math.max(0, stops.length - 2));
    }

    let itineraryDrawerDown = false;

    function fitItineraryCamera(isDrawerDown = itineraryDrawerDown, selectedIndex = currentHighlightedLeg) {
      itineraryDrawerDown = Boolean(isDrawerDown);
      currentHighlightedLeg = selectedIndex;

      if (!map || typeof google === 'undefined' || !google.maps) {
        updateFallbackRoutes(selectedIndex, itineraryDrawerDown);
        return;
      }

      const immediateIdx = getImmediateLegIndex(currentStops);
      const bounds = new google.maps.LatLngBounds();

      // Collect target legs to frame:
      const targetIndices = new Set();
      targetIndices.add(immediateIdx);
      if (selectedIndex !== null && selectedIndex >= 0 && selectedIndex < legObjects.length) {
        targetIndices.add(selectedIndex);
      }

      // Add all points from the target legs:
      targetIndices.forEach(idx => {
        if (legObjects[idx] && legObjects[idx].pathPoints) {
          legObjects[idx].pathPoints.forEach(pt => bounds.extend(pt));
        }
        if (currentStops[idx]) {
          const p = getCoordsForStop(currentStops[idx]);
          bounds.extend(new google.maps.LatLng(p.lat, p.lng));
        }
        if (currentStops[idx + 1]) {
          const p = getCoordsForStop(currentStops[idx + 1]);
          bounds.extend(new google.maps.LatLng(p.lat, p.lng));
        }
      });

      // Always ensure KŌBASHI is included:
      bounds.extend(new google.maps.LatLng(1.28445, 103.84475));

      // Calculate buffer margins to ensure badges, stop pin circles, and route endpoints have ample padding:
      const ne = bounds.getNorthEast();
      const sw = bounds.getSouthWest();
      const latSpan = Math.max(0.0018, ne.lat() - sw.lat());
      const lngSpan = Math.max(0.0018, ne.lng() - sw.lng());

      bounds.extend(new google.maps.LatLng(ne.lat() + latSpan * 0.18, ne.lng() + lngSpan * 0.20));
      bounds.extend(new google.maps.LatLng(sw.lat() - latSpan * 0.18, sw.lng() - lngSpan * 0.20));

      const mapHeight = window.innerHeight || document.documentElement.clientHeight || 800;

      if (itineraryDrawerDown) {
        // Collapsed drawer at bottom: top: calc(100% - 156px)
        map.fitBounds(bounds, { top: 80, bottom: 175, left: 45, right: 55 });
      } else {
        // Drawer is UP at top: 360px.
        // Drawer covers from 360px down to mapHeight.
        const bottomPadding = Math.max(120, (mapHeight - 360) + 20);
        map.fitBounds(bounds, { top: 70, bottom: bottomPadding, left: 40, right: 50 });
      }
    }

    function getStopCanonicalKey(stop) {
      if (!stop) return '';
      const str = ((stop.title || '') + ' ' + (stop.id || '')).toLowerCase();
      if (str.includes('boat quay') || str.includes('boat-quay')) return 'boat-quay';
      if (str.includes('kahve')) return 'kahve';
      if (str.includes('suntec')) return 'suntec';
      if (str.includes('kobashi') || str.includes('kōbashi')) return 'kobashi';
      if (str.includes('maxwell')) return 'maxwell';
      if (str.includes('loulouca')) return 'loulouca';
      if (str.includes('green') || str.includes('capitaspring')) return 'green-oasis';
      return (stop.id || '').toLowerCase();
    }

    function renderItinerary(stops) {
      if (!stops || stops.length === 0) return;

      // Clean existing overlays & polylines
      legObjects.forEach(leg => {
        if (leg.polyline) leg.polyline.setMap(null);
        if (leg.glow) leg.glow.setMap(null);
        if (leg.badgeOverlay) leg.badgeOverlay.setMap(null);
      });
      legObjects = [];

      customOverlays.forEach(ov => ov.setMap(null));
      customOverlays = [];

      if (!map || typeof google === 'undefined' || !google.maps) {
        // SVG Fallback mode
        document.body.classList.add('mode-itinerary');
        document.body.classList.remove('mode-explore');
        document.getElementById('svg-explore-map').style.display = 'none';
        document.getElementById('svg-itinerary-map').style.display = 'block';
        updateFallbackRoutes(null);
        return;
      }

      document.body.classList.add('mode-itinerary');
      document.body.classList.remove('mode-explore');
      document.getElementById('svg-explore-map').style.display = 'none';
      document.getElementById('svg-itinerary-map').style.display = 'none';

      const immediateIdx = getImmediateLegIndex(stops);

      // Render each leg between adjacent stops
      for (let i = 0; i < stops.length - 1; i++) {
        const fromStop = stops[i];
        const toStop = stops[i + 1];
        const origin = getCoordsForStop(fromStop);
        const dest = getCoordsForStop(toStop);

        let travelType = 'walk';
        let badgeTime = '8 min';
        let badgeDist = '600 m';
        let customPath = null;
        let customBadgePoint = null;

        const fromKey = getStopCanonicalKey(fromStop);
        const toKey = getStopCanonicalKey(toStop);
        const pair = `${fromKey}->${toKey}`;

        switch (pair) {
          case 'kahve->suntec':
            travelType = 'downtown';
            badgeTime = '12 min';
            badgeDist = 'DTL · DT17 → DT15';
            break;
          case 'suntec->kahve':
            travelType = 'bus';
            badgeTime = '18 min';
            badgeDist = 'Bus 107 · 5 stops';
            break;
          case 'suntec->kobashi':
            travelType = 'bus';
            badgeTime = '18 min';
            badgeDist = 'Bus 107 · 5 stops';
            break;
          case 'kobashi->suntec':
            travelType = 'bus';
            badgeTime = '18 min';

            badgeTime = '9 min';

          default:

              travelType = 'thomson';

              badgeDist = 'TEL · TE19 → TE18';

              travelType = i % 2 === 0 ? 'walk' : 'bus';

        // Standard Google Maps route styling rules:
        // 1. Walking: Marked by blue dots (#1a73e8)
        // 2. Bus & Car: Solid blue line (#1a73e8)
        // 3. MRT: Solid colour based on MRT line colour (#005caa for DTL, #9D5B25 for TEL)
        let strokeColor = '#1a73e8';
        let isDottedWalk = false;
        let glowColor = '#1a73e8';

        if (travelType === 'downtown') {
          strokeColor = '#005caa'; // MRT Downtown Line blue
          glowColor = '#005caa';
        } else if (travelType === 'thomson') {
          strokeColor = '#9D5B25'; // MRT Thomson-East Coast Line brown
          glowColor = '#9D5B25';
        } else if (travelType === 'bus') {
          strokeColor = '#1a73e8'; // Bus: standard solid blue
          glowColor = '#1a73e8';
        } else {
          isDottedWalk = true;
          strokeColor = '#1a73e8'; // Walk: standard blue dots
          glowColor = '#1a73e8';
        }

        const rawPath = customPath || generatePath(origin, dest, travelType);
        const pathPoints = rawPath.map(p => new google.maps.LatLng(p.lat, p.lng));

        // Default visibility: ONLY show the most immediate route after Kobashi
        const isImmediate = i === immediateIdx;

        // Underlying soft glow polyline
        const glowPolyline = new google.maps.Polyline({
          path: pathPoints,
          geodesic: true,
          strokeColor: glowColor,
          strokeOpacity: isImmediate ? 0.25 : 0,
          strokeWeight: 14,
          map: isImmediate ? map : null,
          zIndex: 10 + i
        });

        // Main Polyline: Dotted circles for Walk, Solid Line for Bus / MRT
        let polyline;

          polyline = new google.maps.Polyline({
            path: pathPoints,
            geodesic: true,
            strokeOpacity: 0,
            icons: [{
              icon: {
                path: google.maps.SymbolPath.CIRCLE,
                fillOpacity: 1,

                fillColor: '#1a73e8',
                strokeColor: '#ffffff',

              offset: '0',

            }],

          });

          polyline = new google.maps.Polyline({
            path: pathPoints,

            strokeOpacity: 0.95,

            map: isImmediate ? map : null,
            zIndex: 20 + i
          });

          highlightLeg(legIndex);

        polyline.addListener('click', handleLegClick);
        glowPolyline.addListener('click', handleLegClick);

        // Place Route Banner at midpoint (or custom anchor point) with icon matching itinerary
        const midPoint = customBadgePoint
          ? new google.maps.LatLng(customBadgePoint.lat, customBadgePoint.lng)
          : pathPoints[Math.floor(pathPoints.length / 2)];

      // Add Stop Pins on Map (Only show pins for stops connected to visible routes)
      stops.forEach((stop, index) => {

        const pinContent = isCurrent

          : `<div class="stop-point-dot" title="${stop.title}"></div>`;

        const pinOverlay = new window.HTMLOverlay(latLng, pinContent, 'stop-point-marker', () => {
          highlightLeg(Math.min(index, stops.length - 2));
          window.parent.postMessage({ type: 'ROUTE_CLICKED', index }, '*');
        });

        // In default view, show origin (KŌBASHI) and immediate destination pin
        if (isCurrent || index === immediateIdx + 1) {
          pinOverlay.setMap(map);
        }

        pinOverlay.stopIndex = index;
        pinOverlay.stopId = stop.id;
        customOverlays.push(pinOverlay);
      });

      // Fit map bounds to the immediate route after Kobashi
      fitItineraryCamera(itineraryDrawerDown, null);

    function highlightLeg(selectedIndex) {
      const immediateIdx = getImmediateLegIndex(currentStops);

      if (!map || legObjects.length === 0) {
        updateFallbackRoutes(selectedIndex);
        return;
      }

      const combinedBounds = new google.maps.LatLngBounds();

      legObjects.forEach((leg, i) => {
        const isImmediate = i === immediateIdx;
        const isSelected = i === selectedIndex;

        if (isImmediate || isSelected) {
          // Show both immediate route and the selected additional route
          leg.polyline.setMap(map);
          leg.glow.setMap(map);
          leg.badgeOverlay.setMap(map);

          if (isSelected) {
            // Selected route: full highlight
            if (leg.isDottedWalk) {
              leg.polyline.setOptions({
                icons: [{
                  icon: {
                    path: google.maps.SymbolPath.CIRCLE,
                    fillOpacity: 1,
                    scale: 4.8,
                    fillColor: '#1a73e8',
                    strokeColor: '#ffffff',
                    strokeWeight: 1
                  },
                  offset: '0',
                  repeat: '14px'
                }],
                zIndex: 100
              });
            } else {
              leg.polyline.setOptions({
                strokeColor: leg.strokeColor,
                strokeWeight: 8,
                strokeOpacity: 1.0,
                zIndex: 100
              });
            }
            leg.glow.setOptions({
              strokeColor: leg.glowColor,
              strokeWeight: 18,
              strokeOpacity: 0.45,
              zIndex: 99
            });
            if (leg.badgeOverlay && leg.badgeOverlay.div) {
              leg.badgeOverlay.div.classList.add('highlighted');
              leg.badgeOverlay.div.classList.remove('dimmed');
            }
          } else {
            // Immediate route when another route is selected: keep visible alongside
            if (leg.isDottedWalk) {
              leg.polyline.setOptions({
                icons: [{
                  icon: {
                    path: google.maps.SymbolPath.CIRCLE,
                    fillOpacity: 0.95,
                    scale: 3.5,
                    fillColor: '#1a73e8',
                    strokeColor: '#ffffff',
                    strokeWeight: 0.5
                  },
                  offset: '0',
                  repeat: '13px'
                }],
                zIndex: 30
              });
            } else {
              leg.polyline.setOptions({
                strokeColor: leg.strokeColor,
                strokeWeight: 6,
                strokeOpacity: 0.95,
                zIndex: 30
              });
            }
            leg.glow.setOptions({
              strokeColor: leg.glowColor,
              strokeWeight: 14,
              strokeOpacity: 0.22,
              zIndex: 25
            });
            if (leg.badgeOverlay && leg.badgeOverlay.div) {
              leg.badgeOverlay.div.classList.remove('highlighted', 'dimmed');
            }
          }

          leg.pathPoints.forEach(pt => combinedBounds.extend(pt));
        } else {
          // Hide other routes
          leg.polyline.setMap(null);
          leg.glow.setMap(null);
          leg.badgeOverlay.setMap(null);
        }
      });

      // Stop pins: Only show pins for stops connected to the currently visible routes
      const visibleStopIndices = new Set();
      visibleStopIndices.add(immediateIdx);
      visibleStopIndices.add(immediateIdx + 1);
      if (selectedIndex !== null && selectedIndex >= 0 && selectedIndex < currentStops.length - 1) {
        visibleStopIndices.add(selectedIndex);
        visibleStopIndices.add(selectedIndex + 1);
      }

      customOverlays.forEach(ov => {
        if (ov && ov.stopIndex !== undefined) {
          if (visibleStopIndices.has(ov.stopIndex)) {
            ov.setMap(map);
          } else {
            ov.setMap(null);
          }
        }
      });

      // Frame camera to include both immediate route and selected additional route
      fitItineraryCamera(itineraryDrawerDown, selectedIndex);
    }

    function resetHighlight() {
      const immediateIdx = getImmediateLegIndex(currentStops);

      if (!map || legObjects.length === 0) {
        updateFallbackRoutes(null);
        return;
      }

      const immediateBounds = new google.maps.LatLngBounds();

      legObjects.forEach((leg, i) => {
        if (i === immediateIdx) {
          leg.polyline.setMap(map);
          leg.glow.setMap(map);
          leg.badgeOverlay.setMap(map);

          if (leg.isDottedWalk) {
            leg.polyline.setOptions({
              icons: [{
                icon: {
                  path: google.maps.SymbolPath.CIRCLE,
                  fillOpacity: 1,
                  scale: 3.8,
                  fillColor: '#1a73e8',
                  strokeColor: '#ffffff',
                  strokeWeight: 0.5
                },
                offset: '0',
                repeat: '13px'
              }],
              zIndex: 20
            });
          } else {
            leg.polyline.setOptions({
              strokeColor: leg.strokeColor,
              strokeWeight: 6,
              strokeOpacity: 0.95,
              zIndex: 20
            });
          }
          leg.glow.setOptions({
            strokeColor: leg.glowColor,
            strokeWeight: 14,
            strokeOpacity: 0.22,
            zIndex: 10
          });
          if (leg.badgeOverlay && leg.badgeOverlay.div) {
            leg.badgeOverlay.div.classList.remove('highlighted', 'dimmed');
          }

          leg.pathPoints.forEach(pt => immediateBounds.extend(pt));
          const kobashiPos = getCoordsForStop(currentStops[immediateIdx]);
          immediateBounds.extend(new google.maps.LatLng(kobashiPos.lat, kobashiPos.lng));
        } else {
          leg.polyline.setMap(null);
          leg.glow.setMap(null);
          leg.badgeOverlay.setMap(null);
        }
      });

      // Reset stop pins: origin and destination of immediate route should have pins visible
      customOverlays.forEach(ov => {
        if (ov && ov.stopIndex !== undefined) {
          if (ov.stopIndex === immediateIdx || ov.stopIndex === immediateIdx + 1) {
            ov.setMap(map);
          } else {
            ov.setMap(null);
          }
        }
      });

      currentHighlightedLeg = null;
      fitItineraryCamera(itineraryDrawerDown, null);
    }

    function renderBounce(selectedIndex = 1) {

    let bounceDrawerDown = false;

    function fitBounceCamera(isDrawerDown = false) {
      bounceDrawerDown = Boolean(isDrawerDown);

      if (!map || typeof google === 'undefined' || !google.maps) {
        updateFallbackBounce(currentBounceIndex, bounceDrawerDown);
        return;
      }

      const bounds = new google.maps.LatLngBounds();
      // Include origin KŌBASHI
      bounds.extend(new google.maps.LatLng(1.28445, 103.84475));
      // Include all path coordinates
      BOUNCE_ROUTES_DATA.forEach(r => {
        r.path.forEach(pt => bounds.extend(new google.maps.LatLng(pt.lat, pt.lng)));
      });
      // Include NE and SW buffer points to give badge overlays and stop dots ample clearance:
      // Option 0 (CapitaSpring) is at 1.2848, 103.8502 (walk route goes East/NE)
      // Option 1 (Maxwell) is at 1.2804, 103.8440 (walk route goes South)
      // Option 2 (Loulouca) is at 1.2801, 103.8423 (bus route goes South-West)
      bounds.extend(new google.maps.LatLng(1.2858, 103.8515)); // NE buffer (CapitaSpring + badge)
      bounds.extend(new google.maps.LatLng(1.2792, 103.8405)); // SW buffer (Loulouca & Maxwell + pins/badges)

      const mapHeight = window.innerHeight || document.documentElement.clientHeight || 800;

      if (bounceDrawerDown) {
        // Drawer is down / collapsed to bottom (~310px)
        map.fitBounds(bounds, { top: 90, bottom: 315, left: 40, right: 40 });
      } else {
        // Drawer is UP at top: 236px.
        // The drawer covers from 236px to the bottom of the map.
        const bottomPadding = Math.max(120, mapHeight - 236 + 18);
        map.fitBounds(bounds, { top: 50, bottom: bottomPadding, left: 35, right: 35 });
      }
    }

    function highlightBounceOption(newIndex) {
      currentBounceIndex = newIndex;
      legObjects.forEach(leg => {
        const isSelected = leg.routeIndex === newIndex;
        if (leg.mode === 'walk') {
          leg.polyline.setOptions({
            icons: [{
              icon: {
                path: google.maps.SymbolPath.CIRCLE,
                fillOpacity: isSelected ? 1 : 0.6,
                strokeOpacity: isSelected ? 1 : 0.6,
                scale: isSelected ? 4.8 : 3.8,
                fillColor: '#1a73e8',
                strokeColor: '#ffffff',
                strokeWeight: isSelected ? 1 : 0.5
              },
              offset: '0',
              repeat: '13px'
            }],
            zIndex: isSelected ? 40 : 30
          });
        } else {
          leg.polyline.setOptions({
            strokeOpacity: isSelected ? 1.0 : 0.6,
            strokeWeight: isSelected ? 8 : 6,
            zIndex: isSelected ? 40 : 30
          });
        }
        leg.glow.setOptions({
          strokeOpacity: isSelected ? 0.45 : 0.15,
          strokeWeight: isSelected ? 18 : 14,
          zIndex: isSelected ? 35 : 25
        });
        if (leg.badgeOverlay && leg.badgeOverlay.div) {
          if (isSelected) {
            leg.badgeOverlay.div.classList.add('highlighted');
            leg.badgeOverlay.div.style.opacity = '1';
          } else {
            leg.badgeOverlay.div.classList.remove('highlighted');
            leg.badgeOverlay.div.style.opacity = '0.6';
          }
        }
        if (leg.destPin && leg.destPin.div) {
          const dot = leg.destPin.div.querySelector('.stop-point-dot');
          if (dot) dot.style.opacity = isSelected ? '1' : '0.6';
        }
      });
    }

    function updateFallbackBounce(selectedIndex = 1, isDrawerDown = bounceDrawerDown) {
      const domOverlay = document.getElementById('itinerary-dom-overlay');
      if (!domOverlay) return;
      domOverlay.innerHTML = '';

      const leg0 = document.getElementById('svg-leg-0');
      const leg1 = document.getElementById('svg-leg-1');
      const leg2 = document.getElementById('svg-leg-2');
      if (leg0) leg0.style.display = 'none';
      if (leg1) leg1.style.display = 'none';
      if (leg2) leg2.style.display = 'none';

      let bounceGroup = document.getElementById('svg-bounce-routes');
      if (bounceGroup) {
        bounceGroup.style.display = 'block';
        if (isDrawerDown) {
          bounceGroup.setAttribute('transform', 'translate(0, 110)');
        } else {
          bounceGroup.removeAttribute('transform');
        }
      }

      for (let i = 0; i < 3; i++) {
        const svgPath = document.getElementById(`svg-bounce-${i}`);
        if (svgPath) {
          svgPath.style.opacity = (i === selectedIndex) ? '1' : '0.6';
        }
      }

      const badges = isDrawerDown ? [
        {
          index: 0,
          left: '260px',
          top: '235px',
          time: '8 min',
          dist: '600 m',
          iconSvg: getModeIconSvg('walk')
        },
        {
          index: 1,
          left: '190px',
          top: '305px',
          time: '4 min',
          dist: '350 m',
          iconSvg: getModeIconSvg('walk')
        },
        {
          index: 2,
          left: '130px',
          top: '335px',
          time: '9 min',
          dist: 'Bus 80 · 4 stops',
          iconSvg: getModeIconSvg('bus')
        }
      ] : [
        {
          index: 0,
          left: '250px',
          top: '115px',
          time: '8 min',
          dist: '600 m',
          iconSvg: getModeIconSvg('walk')
        },
        {
          index: 1,
          left: '185px',
          top: '165px',
          time: '4 min',
          dist: '350 m',
          iconSvg: getModeIconSvg('walk')
        },
        {
          index: 2,
          left: '135px',
          top: '185px',
          time: '9 min',
          dist: 'Bus 80 · 4 stops',
          iconSvg: getModeIconSvg('bus')
        }
      ];

      badges.forEach(b => {
        const isSelected = b.index === selectedIndex;
        const badgeEl = document.createElement('div');
        badgeEl.className = `route-badge-overlay ${isSelected ? 'highlighted' : ''}`;
        badgeEl.style.left = b.left;
        badgeEl.style.top = b.top;
        badgeEl.style.opacity = isSelected ? '1' : '0.6';
        badgeEl.innerHTML = `
          <div class="route-badge-top">
            ${b.iconSvg}
            <span>${b.time}</span>
          </div>
          <div class="route-badge-sub">${b.dist}</div>
        `;
        badgeEl.onclick = () => {
          updateFallbackBounce(b.index, isDrawerDown);
          window.parent.postMessage({ type: 'BOUNCE_ROUTE_CLICKED', index: b.index }, '*');
        };
        domOverlay.appendChild(badgeEl);
      });
    }

    // Message listener for React app
    window.addEventListener('message', (event) => {
      const data = event.data;
      if (!data) return;

      if (data.type === 'BOUNCE_DRAWER_TOGGLE') {
        fitBounceCamera(Boolean(data.drawerDown));
      }

      if (data.type === 'ITINERARY_DRAWER_TOGGLE') {
        fitItineraryCamera(Boolean(data.drawerDown), currentHighlightedLeg);
      }

      if (data.type === 'THEME_TOGGLE') {
        isNightMode = Boolean(data.isDark);
        if (map) {
          map.setOptions({ styles: isNightMode ? nightModeStyles : [] });
        }
        document.body.classList.toggle('theme-light', !isNightMode);
      }

      if (data.type === 'SET_MODE') {
        mode = data.mode || 'explore';
        currentStops = data.stops || [];
        if (data.drawerDown !== undefined) {
          itineraryDrawerDown = Boolean(data.drawerDown);
        }

        if (mode === 'bounce') {
          renderBounce(data.selectedIndex !== undefined ? data.selectedIndex : 1);
        } else if (mode === 'itinerary') {
          document.body.classList.add('mode-itinerary');
          document.body.classList.remove('mode-explore', 'mode-bounce');
          document.getElementById('svg-explore-map').style.display = 'none';
          document.getElementById('svg-itinerary-map').style.display = 'block';

          const bounceGroup = document.getElementById('svg-bounce-routes');
          if (bounceGroup) bounceGroup.style.display = 'none';

          // Hide user marker in itinerary screen
          const userMarker = document.getElementById('user-marker-el');
          if (userMarker) {
            userMarker.style.display = 'none';
          }

          if (map) {
            renderItinerary(currentStops);
          } else {
            updateFallbackRoutes(null);
          }
        } else {
          document.body.classList.remove('mode-itinerary', 'mode-bounce');
          document.body.classList.add('mode-explore');
          document.getElementById('svg-explore-map').style.display = 'block';
          document.getElementById('svg-itinerary-map').style.display = 'none';

          const bounceGroup = document.getElementById('svg-bounce-routes');
          if (bounceGroup) bounceGroup.style.display = 'none';

          const domOverlay = document.getElementById('itinerary-dom-overlay');
          if (domOverlay) domOverlay.innerHTML = '';

          // User marker hidden per user request
          const userMarker = document.getElementById('user-marker-el');
          if (userMarker) {
            userMarker.style.display = 'none';
          }

          if (map) {
            map.panTo({ lat: 1.3435, lng: 103.7315 });
            map.setZoom(15.2);
            // Clear itinerary objects
            legObjects.forEach(leg => {
              if (leg.polyline) leg.polyline.setMap(null);
              if (leg.glow) leg.glow.setMap(null);
              if (leg.badgeOverlay) leg.badgeOverlay.setMap(null);
            });
            legObjects = [];
            customOverlays.forEach(ov => ov.setMap(null));
            customOverlays = [];
          }
        }
      }

      if (data.type === 'SET_BOUNCE_SELECTED') {
        highlightBounceOption(data.index);
      }

      if (data.type === 'RECENTER_BOUNCE') {
        renderBounce(currentBounceIndex);
      }

      if (data.type === 'HIGHLIGHT_LEG') {
        highlightLeg(data.index);
      }

      if (data.type === 'RESET_HIGHLIGHT') {
        resetHighlight();
      }

      if (data.type === 'UPDATE_STOPS') {
        currentStops = data.stops || [];
        renderItinerary(currentStops);
      }

      if (data.type === 'WINDOW_RESIZE') {
        if (map && typeof google !== 'undefined' && google.maps) {
          google.maps.event.trigger(map, 'resize');
          if (mode === 'itinerary') {
            fitItineraryCamera(itineraryDrawerDown, currentHighlightedLeg);
          } else if (mode === 'bounce') {
            fitBounceCamera(bounceDrawerDown);
          }
        }
      }

      if (data.type === 'RECENTER') {
        if (map) {
          if (mode === 'itinerary') {
            fitItineraryCamera(itineraryDrawerDown, currentHighlightedLeg);
          } else if (mode === 'bounce') {
            renderBounce(currentBounceIndex);
          } else {
            map.panTo({ lat: 1.3430, lng: 103.7318 });
            map.setZoom(15.2);
          }
        }
      }
    });

    // Dynamic resize handler for responsive preview (e.g. Figma Make device switching)
    window.addEventListener('resize', () => {
      if (map && typeof google !== 'undefined' && google.maps) {
        google.maps.event.trigger(map, 'resize');
        if (mode === 'itinerary') {
          fitItineraryCamera(itineraryDrawerDown, currentHighlightedLeg);
        } else if (mode === 'bounce') {
          fitBounceCamera(bounceDrawerDown);
        }
      }
    });

    // Initialize clean fallback state (immediate route only)
    updateFallbackRoutes(null);
  </script>
  <script async defer
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCR9Vi_lsTBLbpgfDYP-0kdy81b2PkaE-w&callback=initMap"></script>
</body>
