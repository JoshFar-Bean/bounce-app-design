<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bounce Map Prototype (Full Itinerary & Live Routing)</title>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: transparent !important; }
    #map { width: 100vw; height: 100vh; transition: height 0.4s ease-in-out; }

    /* Interactive Bottom Sheet Drawer */
    #drawer {
      position: absolute; bottom: 0; left: 0; width: 100%; height: 65%; 
      background: #1e1e1e; border-top-left-radius: 24px; border-top-right-radius: 24px;
      z-index: 50; transition: transform 0.4s cubic-bezier(0.1, 0.8, 0.2, 1); 
      padding: 24px 16px; box-sizing: border-box; color: white;
      overflow-y: auto; box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
    }
    
    /* Slides down when a route is tapped */
    #drawer.collapsed { transform: translateY(65%); } 
    
    /* UI Card Styling */
    .card { 
      background: #2a2a2a; padding: 16px; border-radius: 16px; margin-bottom: 12px; 
      cursor: pointer; border: 2px solid transparent; transition: all 0.2s;
      display: flex; flex-direction: column; gap: 8px;
    }
    .card.active { border-color: #00e6b8; background: #2f3634; }
    
    .location-header { display: flex; align-items: center; gap: 12px; }
    .node-dot { width: 12px; height: 12px; border-radius: 50%; border: 3px solid #666; }
    .card.active .node-dot { border-color: #00e6b8; background: #00e6b8; }
    
    .card h3 { margin: 0; font-size: 16px; color: #fff; }
    .card p.subtitle { margin: 0; font-size: 13px; color: #aaa; }
    
    /* Routing Metadata Styling */
    .route-meta { display: flex; align-items: center; gap: 12px; margin-left: 24px; padding-top: 8px; border-left: 2px solid #444; padding-left: 18px; }
    .transport-icon { font-size: 16px; }
    
    /* Transit Badge (MRT & Bus) */
    .transit-badge { 
      display: inline-block; padding: 2px 8px; border-radius: 4px; 
      color: white; font-weight: bold; font-size: 13px;
    }
    .route-details { font-size: 13px; color: #ccc; display: flex; flex-direction: column;}
    .next-up { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; }

    /* Floating Action Buttons for Prototype Control */
    .controls { position: absolute; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 100; }
    .controls button { background: #00e6b8; color: #000; padding: 12px 20px; border: none; border-radius: 24px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    .controls button.reset { background: #444; color: white; }
  </style>
</head>
<body>
  <!-- 1. Only the map container remains -->
  <div id="map"></div>

  <script>
    let map;
    let directionsService;

    // 1. Core Itinerary State Data
    // We pre-configure the exact text, colors, and transit modes based on the Figma designs
    let plan = [
      { id: 1, name: "Kahve", subtitle: "Coffee · Shenton Way", lat: 1.2770, lng: 103.8500, mode: "TRANSIT", transitDesc: "Downtown Line", transitDetails: "DT17 → DT15 · 12 min", badgeColor: "#005caa", icon: "🚆", isBus: false },
      { id: 2, name: "Suntec City views", subtitle: "Walk · 1.2 km", lat: 1.2935, lng: 103.8575, mode: "TRANSIT", transitDesc: "107", transitDetails: "5 stops · 18 min", badgeColor: "#34a853", icon: "🚍", isBus: true },
      { id: 3, name: "KŌBASHI", subtitle: "Bakery · South Bridge Road", lat: 1.2840, lng: 103.8440, mode: "WALKING", transitDesc: "Walk", transitDetails: "600 m · 8 min", badgeColor: "transparent", icon: "🚶", isBus: false },
      { id: 4, name: "Green Oasis · CapitaSpring", subtitle: "Garden · 8 min walk", lat: 1.2843, lng: 103.8504, mode: "TRANSIT", transitDesc: "Thomson-East Coast Line", transitDetails: "TE19 → TE18 · 14 min", badgeColor: "#9D5B25", icon: "🚆", isBus: false },
      { id: 5, name: "Loulouca", subtitle: "Dessert · Closes 11 pm", lat: 1.2805, lng: 103.8446, mode: null }
    ];

    const nightModeStyles = [
      { elementType: "geometry", stylers: [{ color: "#242f3e" }] },
      { elementType: "labels.text.stroke", stylers: [{ color: "#242f3e" }] },
      { elementType: "labels.text.fill", stylers: [{ color: "#746855" }] },
      { featureType: "road", elementType: "geometry", stylers: [{ color: "#38414e" }] },
      { featureType: "road", elementType: "labels.text.fill", stylers: [{ color: "#9ca5b3" }] },
      { featureType: "water", elementType: "geometry", stylers: [{ color: "#17263c" }] }
    ];

    function initMap() {
      directionsService = new google.maps.DirectionsService();
      map = new google.maps.Map(document.getElementById('map'), {
        center: { lat: 1.2840, lng: 103.8440 }, 
        zoom: 14,
        disableDefaultUI: true,
        styles: nightModeStyles // Start in dark mode
      });
      
      renderPlan();
    }

    // 2. Render UI and API Routes dynamically
    function renderPlan() {
      // Clear old map lines
      renderers.forEach(r => r.setMap(null)); 
      renderers = [];
      
      const listContainer = document.getElementById('itinerary-list');
      listContainer.innerHTML = '';

      for (let i = 0; i < plan.length; i++) {
        const origin = plan[i];
        const dest = plan[i+1]; // May be undefined for the last stop

        const card = document.createElement('div');
        card.className = 'card';
        card.id = `card-${i}`;
        
        // Build the Location Header
        let html = `
          <div class="location-header">
            <div class="node-dot"></div>
            <div>
              <h3>${origin.name}</h3>
              <p class="subtitle">${origin.subtitle}</p>
            </div>
          </div>
        `;

        // If there is a next destination, build the routing block
        if (dest) {
          const badgeHtml = origin.badgeColor !== "transparent" 
            ? `<span class="transit-badge" style="background-color: ${origin.badgeColor}">${origin.transitDesc}</span>`
            : `<span style="font-weight: bold; font-size: 13px; color: #fff;">${origin.transitDesc}</span>`;

          html += `
            <div class="route-meta">
              <span class="transport-icon">${origin.icon}</span>
              <div class="route-details">
                <div>${origin.isBus ? 'Bus ' : ''}${badgeHtml}</div>
                <div>${origin.transitDetails}</div>
                <div class="next-up">Next: ${dest.name}</div>
              </div>
            </div>
          `;
          
          card.onclick = () => highlightLeg(i); 

          // Fetch real coordinates to draw the path on the map
          directionsService.route({
            origin: { lat: origin.lat, lng: origin.lng },
            destination: { lat: dest.lat, lng: dest.lng },
            travelMode: google.maps.TravelMode[origin.mode],
          }, (response, status) => {
            if (status === "OK") {
              const renderer = new google.maps.DirectionsRenderer({
                map: map,
                directions: response,
                suppressMarkers: true, // We hide default Google markers for a cleaner look
                polylineOptions: {
                  strokeColor: origin.mode === 'WALKING' ? "#00e6b8" : origin.badgeColor, // Uses the exact MRT/Bus color
                  strokeWeight: 6,
                  strokeOpacity: 0.8
                }
              });
              renderers[i] = renderer;
            }
          });
        }
        
        card.innerHTML = html;
        listContainer.appendChild(card);
      }
    }

    // 3. Highlight specific route leg and collapse drawer
    function highlightLeg(index) {
      document.getElementById('drawer').classList.add('collapsed');
      
      // Update UI Cards
      document.querySelectorAll('.card').forEach((c, i) => {
        c.classList.toggle('active', i === index);
      });
      
      // Update Map Lines
      renderers.forEach((r, i) => {
        if (i === index) {
          r.setOptions({ polylineOptions: { strokeWeight: 8, strokeOpacity: 1.0, zIndex: 100, strokeColor: r.polylineOptions.strokeColor } });
        } else {
          r.setOptions({ polylineOptions: { strokeOpacity: 0.2, zIndex: 1, strokeColor: r.polylineOptions.strokeColor } });
        }
      });
    }

    function resetDrawer() {
      document.getElementById('drawer').classList.remove('collapsed');
      document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
      renderers.forEach(r => r.setOptions({ polylineOptions: { strokeOpacity: 0.8, strokeWeight: 6, zIndex: 50, strokeColor: r.polylineOptions.strokeColor } }));
    }

    // 4. Simulate a Bounce insertion
    function triggerBounce() {
      // Insert Maxwell Food Centre after KOBASHI (Index 2)
      plan.splice(3, 0, { 
        id: 99, 
        name: "Maxwell Food Centre", 
        subtitle: "Bounce addition · Nearby now", 
        lat: 1.2825, lng: 103.8444, 
        mode: "WALKING", transitDesc: "Walk", transitDetails: "400 m · 5 min", badgeColor: "transparent", icon: "🚶", isBus: false 
      });
      
      // Update KOBASHI's routing to walk to Maxwell instead of CapitaSpring
      plan[2].transitDetails = "400 m · 5 min";
      
      resetDrawer();
      renderPlan(); // Automatically recalculates everything, updates "Next" labels, and redraws map
    }

   // Listen for the theme toggle message from React
window.addEventListener('message', (event) => {
  if (event.data && event.data.type === 'THEME_TOGGLE') {
    const isDark = event.data.isDark;
    // Apply nightModeStyles if true, or an empty array (default light) if false
    map.setOptions({ styles: isDark ? nightModeStyles : [] });
  }
});
  </script>
  <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCR9Vi_lsTBLbpgfDYP-0kdy81b2PkaE-w&callback=initMap"></script>
</body>
</html>
