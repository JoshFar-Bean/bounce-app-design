<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bounce · Google Maps</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f2f3f5;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <iframe id="app-frame" src="http://localhost:8443/"></iframe>
  <script>
    if (window.location.search) {
      document.getElementById('app-frame').src = 'http://localhost:8443/' + window.location.search;
    }
  </script>
</body>
</html>
