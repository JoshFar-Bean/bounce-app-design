<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bounce — Light Mode Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-canvas: #f8fafc;
      --phone-w: 400px;
      --phone-h: 866px;
      --bezel-thickness: 10px;
      --black-chassis-grad: linear-gradient(135deg, 
        #2c3036 0%, 
        #1d2126 15%, 
        #131518 32%, 
        #25292f 48%, 
        #141619 65%, 
        #1f2328 85%, 
        #2b2f35 100%
      );
      --black-rim-glow: 
        0 0 0 1px rgba(0, 0, 0, 0.08), 
        0 0 0 2px rgba(18, 20, 24, 0.85), 
        0 24px 64px rgba(0, 0, 0, 0.25), 
        0 8px 24px rgba(0, 0, 0, 0.15);
      --dynamic-island-w: 122px;
      --dynamic-island-h: 32px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-canvas);
      background-image: radial-gradient(circle at 50% 25%, #ffffff 0%, #f1f5f9 65%, #e2e8f0 100%);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Prototype Header Badge */
    .prototype-header {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 999px;
      padding: 6px 14px 6px 18px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }
    .prototype-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      color: #0f172a;
    }
    .prototype-badge {
      background: #e0f2fe;
      color: #0369a1;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      letter-spacing: 0.02em;
    }
    .prototype-switch-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: #475569;
      text-decoration: none;
      padding: 4px 12px;
      border-radius: 999px;
      background: #f1f5f9;
      transition: all 0.15s ease;
    }
    .prototype-switch-link:hover {
      background: #e2e8f0;
      color: #0f172a;
    }

    /* Device Stage */
    .stage {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: center center;
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      margin-top: 24px;
    }

    /* iPhone 18 Pro Black Chassis */
    .iphone-18-pro {
      position: relative;
      width: calc(var(--phone-w) + var(--bezel-thickness) * 2);
      height: calc(var(--phone-h) + var(--bezel-thickness) * 2);
      border-radius: 56px;
      background: var(--black-chassis-grad);
      padding: var(--bezel-thickness);
      box-shadow: var(--black-rim-glow);
    }

    /* Chamfered Inner Metallic Rim */
    .chassis-inner-rim {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000000;
      border-radius: 46px;
      overflow: hidden;
      box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.08),
                  inset 0 0 5px rgba(0, 0, 0, 0.95);
    }

    /* Metallic Hardware Buttons - Black Titanium */
    .hardware-btn {
      position: absolute;
      background: linear-gradient(90deg, #181a1d, #2b3036);
      box-shadow: -1px 0 3px rgba(0, 0, 0, 0.6);
      pointer-events: none;
    }
    .btn-action-hardware {
      left: -4px;
      top: 155px;
      width: 4px;
      height: 32px;
      border-radius: 3px 0 0 3px;
    }
    .btn-vol-up {
      left: -4px;
      top: 205px;
      width: 4px;
      height: 58px;
      border-radius: 3px 0 0 3px;
    }
    .btn-vol-down {
      left: -4px;
      top: 275px;
      width: 4px;
      height: 58px;
      border-radius: 3px 0 0 3px;
    }
    .btn-power-hardware {
      right: -4px;
      top: 220px;
      width: 4px;
      height: 88px;
      border-radius: 0 3px 3px 0;
      box-shadow: 1px 0 3px rgba(0, 0, 0, 0.6);
    }

    /* Subtle Antenna Bands */
    .antenna-notch {
      position: absolute;
      background: rgba(255, 255, 255, 0.08);
      pointer-events: none;
    }
    .antenna-top-left { left: 45px; top: 0; width: 4px; height: 10px; }
    .antenna-top-right { right: 45px; top: 0; width: 4px; height: 10px; }
    .antenna-bot-left { left: 45px; bottom: 0; width: 4px; height: 10px; }
    .antenna-bot-right { right: 45px; bottom: 0; width: 4px; height: 10px; }

    /* Dynamic Island Overlay */
    .dynamic-island {
      position: absolute;
      top: 11px;
      left: 50%;
      transform: translateX(-50%);
      width: var(--dynamic-island-w);
      height: var(--dynamic-island-h);
      background: #000000;
      border-radius: 20px;
      z-index: 50;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 12px;
      box-shadow: 0 0 1px 1px rgba(255, 255, 255, 0.04);
    }
    .island-camera-lens {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #18283b 0%, #0d131a 50%, #05070a 100%);
      box-shadow: inset 0 0 2px rgba(255, 255, 255, 0.2);
    }

    /* Embedded Screen Viewport Iframe */
    .screen-viewport {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #ffffff;
    }

    /* Floating Minimal Remote Toolbar */
    .floating-remote {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.35);
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .floating-remote.hidden {
      transform: translate(-50%, 120%);
      opacity: 0;
      pointer-events: none;
    }

    .remote-group {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .remote-btn {
      appearance: none;
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.82);
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      padding: 7px 12px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .remote-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
    }
    .remote-btn:active {
      transform: scale(0.96);
    }
    .remote-btn.active {
      background: #1a73e8;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(26, 115, 232, 0.4);
    }

    .remote-divider {
      width: 1px;
      height: 18px;
      background: rgba(255, 255, 255, 0.15);
      margin: 0 4px;
    }

    .scale-indicator {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      color: rgba(255, 255, 255, 0.6);
      padding: 0 4px;
      min-width: 44px;
      text-align: center;
    }
    .key-hint {
      font-size: 10px;
      opacity: 0.5;
      font-family: 'JetBrains Mono', monospace;
      padding: 1px 4px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.1);
      margin-left: 2px;
    }
  </style>
</head>
<body>

  <!-- Top Prototype Info Badge -->
  <header class="prototype-header">
    <div class="prototype-title">
      <span>☀️</span>
      <span>Prototype 1: Light Mode Default</span>
      <span class="prototype-badge">Default Light · Dark Optional</span>
    </div>
    <a href="prototype-dark.html" class="prototype-switch-link" title="Switch to Prototype 2 (Dark Mode Default)">
      <span>🌙</span> Switch to Dark Prototype &rarr;
    </a>
  </header>

  <!-- Interactive Device Stage -->
  <div class="stage" id="device-stage">
    
    <div class="iphone-18-pro">

      <!-- Physical Buttons -->
      <div class="hardware-btn btn-action-hardware"></div>
      <div class="hardware-btn btn-vol-up"></div>
      <div class="hardware-btn btn-vol-down"></div>
      <div class="hardware-btn btn-power-hardware"></div>

      <!-- Antenna Cuts -->
      <div class="antenna-notch antenna-top-left"></div>
      <div class="antenna-notch antenna-top-right"></div>
      <div class="antenna-notch antenna-bot-left"></div>
      <div class="antenna-notch antenna-bot-right"></div>

      <!-- Inner Screen Bezel -->
      <div class="chassis-inner-rim">
        
        <!-- Dynamic Island -->
        <div class="dynamic-island">
          <div class="island-camera-lens"></div>
        </div>

        <!-- Embedded Interactive App Iframe (defaults to Light Mode) -->
        <iframe id="app-iframe" class="screen-viewport" src="/?screen=map&prototype=light&theme=light&frame=0"></iframe>

      </div>

    </div>

  </div>

  <!-- Floating Minimal Remote Toolbar -->
  <div class="floating-remote" id="remote-bar">
    
    <!-- Key Screens -->
    <div class="remote-group">
      <button class="remote-btn active" id="btn-screen-map" onclick="setScreen('map')">
        🗺️ Explore <span class="key-hint">E</span>
      </button>
      <button class="remote-btn" id="btn-screen-plan" onclick="setScreen('plan')">
        📋 Itinerary <span class="key-hint">P</span>
      </button>
      <button class="remote-btn" id="btn-screen-place" onclick="setScreen('place')">
        📍 KŌBASHI <span class="key-hint">K</span>
      </button>
      <button class="remote-btn" id="btn-screen-bounce" onclick="setScreen('bounce')">
        🔀 Bounce <span class="key-hint">B</span>
      </button>
      <button class="remote-btn" id="btn-screen-updated" onclick="setScreen('updated')">
        ✨ Updated <span class="key-hint">U</span>
      </button>
    </div>

    <div class="remote-divider"></div>

    <!-- Drawer Controls -->
    <div class="remote-group">
      <button class="remote-btn" id="btn-drawer-toggle" onclick="toggleDrawer()">
        ↕️ Drawer <span class="key-hint">D</span>
      </button>
    </div>

    <div class="remote-divider"></div>

    <!-- Theme Toggle (Optional Dark Mode) -->
    <div class="remote-group">
      <button class="remote-btn" id="btn-theme-toggle" onclick="toggleTheme()" title="Toggle Optional Dark Mode">
        <span id="theme-icon">☀️</span> Light <span class="key-hint">T</span>
      </button>
    </div>

    <div class="remote-divider"></div>

    <!-- Zoom / Scale Controls -->
    <div class="remote-group">
      <button class="remote-btn" onclick="adjustScale(-0.05)" title="Zoom out (-)">−</button>
      <span class="scale-indicator" id="scale-val">100%</span>
      <button class="remote-btn" onclick="adjustScale(0.05)" title="Zoom in (+)">+</button>
      <button class="remote-btn" onclick="resetScale()" title="Auto fit height">Fit</button>
    </div>

  </div>

  <script>
    let currentScreen = 'map';
    let currentTheme = 'light';
    let isDrawerCollapsed = false;
    let currentScale = 1.0;

    const iframe = document.getElementById('app-iframe');
    const stage = document.getElementById('device-stage');
    const remoteBar = document.getElementById('remote-bar');
    const scaleVal = document.getElementById('scale-val');

    function autoFitScale() {
      const availableHeight = window.innerHeight - 100;
      const phoneHeight = 886;
      if (availableHeight < phoneHeight) {
        currentScale = Math.max(0.65, Math.min(1.0, availableHeight / phoneHeight));
      } else {
        currentScale = 0.95;
      }
      applyScale();
    }

    function applyScale() {
      stage.style.transform = `scale(${currentScale.toFixed(2)})`;
      scaleVal.textContent = `${Math.round(currentScale * 100)}%`;
    }

    function adjustScale(delta) {
      currentScale = Math.max(0.5, Math.min(1.3, currentScale + delta));
      applyScale();
    }

    function resetScale() {
      autoFitScale();
    }

    function updateUrl() {
      let url = `/?screen=${currentScreen}&prototype=light&theme=${currentTheme}&frame=0`;
      if (isDrawerCollapsed) {
        url += '&collapsed=1';
      }
      iframe.src = url;

      document.querySelectorAll('[id^="btn-screen-"]').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById(`btn-screen-${currentScreen}`);
      if (activeBtn) activeBtn.classList.add('active');

      const drawerBtn = document.getElementById('btn-drawer-toggle');
      if (drawerBtn) {
        drawerBtn.textContent = isDrawerCollapsed ? '⬆️ Drawer Up' : '⬇️ Drawer Down';
      }
    }

    function setScreen(screenName) {
      currentScreen = screenName;
      updateUrl();
    }

    function toggleDrawer() {
      isDrawerCollapsed = !isDrawerCollapsed;
      updateUrl();
    }

    function toggleTheme() {
      currentTheme = currentTheme === 'light' ? 'dark' : 'light';
      const btn = document.getElementById('btn-theme-toggle');
      if (currentTheme === 'light') {
        btn.innerHTML = `<span id="theme-icon">☀️</span> Light <span class="key-hint">T</span>`;
      } else {
        btn.innerHTML = `<span id="theme-icon">🌙</span> Dark <span class="key-hint">T</span>`;
      }
      updateUrl();
    }

    function toggleRemoteVisibility() {
      remoteBar.classList.toggle('hidden');
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    window.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();
      if (key === 'e' || key === 'm') {
        setScreen('map');
      } else if (key === 'b') {
        setScreen('bounce');
      } else if (key === 'p' || key === 'i') {
        setScreen('plan');
      } else if (key === 'u') {
        setScreen('updated');
      } else if (key === 'k') {
        setScreen('place');
      } else if (key === 'd') {
        toggleDrawer();
      } else if (key === 't') {
        toggleTheme();
      } else if (key === 'h') {
        toggleRemoteVisibility();
      } else if (key === 'f') {
        toggleFullscreen();
      } else if (key === '+' || key === '=') {
        adjustScale(0.05);
      } else if (key === '-' || key === '_') {
        adjustScale(-0.05);
      } else if (key === '0') {
        resetScale();
      }
    });

    window.addEventListener('resize', autoFitScale);
    autoFitScale();
  </script>
</body>
</html>
